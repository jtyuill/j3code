[package]
name = "j3-desktop"
description = "j3 desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "j3"
path = "src/main.rs"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
dirs.workspace = true
gethostname.workspace = true
# Syntax highlighting for the file pane's preview (JSON comes with
# `tree-sitter`); markdown code blocks in the feed use it too.
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
] }
j3-client.workspace = true
j3-core.workspace = true
j3-protocol.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true


[dev-dependencies]
futures-util.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
