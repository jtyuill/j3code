[package]
name = "j3-desktop"
description = "j3 desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "j3"
path = "src/main.rs"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
base64.workspace = true
# Dictation: microphone capture (CoreAudio, ALSA) and on-device Whisper
# speech recognition built from whisper.cpp; the GPU backend is per target.
cpal = "0.18"
dirs.workspace = true
gethostname.workspace = true
# Syntax highlighting for the file pane's preview, markdown code blocks in
# the feed and tool output (JSON comes with `tree-sitter`).
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
j3-client.workspace = true
j3-core.workspace = true
j3-protocol.workspace = true
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true
# HTTPS for speech model downloads.
reqwest = { workspace = true, features = ["rustls"] }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }


[dev-dependencies]
futures-util.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
