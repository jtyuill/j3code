[package]
name = "j3-desktop"
description = "j3 desktop app (Rune)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "j3"
path = "src/main.rs"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
base64.workspace = true
# Dictation: microphone capture (CoreAudio, ALSA) and on-device Whisper
# speech recognition built from whisper.cpp; the GPU backend is per target.
cpal = "0.18"
dirs.workspace = true
# Settings' font pickers list the installed families (already built for ratex's fonts).
fontdb = "0.23"
gethostname.workspace = true
# Decoders Rune's image cache picks up (it enables PNG and JPEG itself): chat images and
# attachments may be GIF, WebP, BMP or TIFF.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "tiff", "webp"] }
j3-client.workspace = true
j3-core.workspace = true
j3-protocol.workspace = true
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true
# HTTPS for speech model downloads.
reqwest = { workspace = true, features = ["rustls"] }
rune.workspace = true
# Markdown (streaming, GFM tables, syntax-coloured fences) for the feed.
rune-kit = { workspace = true, features = ["markdown"] }
rune-theme-opencode.workspace = true
sha2 = "0.10"
serde.workspace = true
# Tool inputs show their keys in the order omp wrote them.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Checks Vulkan has a device before ggml probes it (ggml throws without one).
ash = "0.38"
whisper-rs = { version = "0.16", features = ["vulkan"] }

[dev-dependencies]
futures-util.workspace = true
