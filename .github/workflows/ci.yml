name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rune on Linux (linuxGuiLibs in flake.nix) links xkbcommon and the Wayland client,
      # plus dictation (speechLibs): ALSA for the microphone, Vulkan headers and glslc for
      # whisper.cpp's Vulkan backend.
      - name: Install Linux GUI and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libasound2-dev glslc

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Live omp and smoke tests are #[ignore]d, so this needs no credentials.
      - name: Test
        run: cargo test --workspace --locked

      # No upstream identity or source citations (docs/m8.md, "Gates").
      - name: Provenance
        if: runner.os == 'Linux'
        run: contrib/check-provenance.sh
