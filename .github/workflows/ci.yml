name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # GPUI on Linux (linuxGuiLibs in flake.nix), plus dictation (speechLibs):
      # ALSA for the microphone, glslc for whisper.cpp's Vulkan shaders.
      - name: Install Linux GUI and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev \
            libx11-dev libxcb1-dev libasound2-dev glslc

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Live omp and smoke tests are #[ignore]d, so this needs no credentials.
      - name: Test
        run: cargo test --workspace --locked

  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
