name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev \
            libx11-dev libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p j3-desktop -p j3-server
      - name: Package
        run: tar -czf j3-x86_64-linux.tar.gz -C target/release j3 j3-server
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: j3-x86_64-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Ad-hoc signed, not notarized: users must right-click > Open on first launch.
      - run: contrib/macos/bundle.sh "$PWD/dist"
      - run: cargo build --release --locked -p j3-server
      - name: Package
        run: |
          ditto -c -k --keepParent dist/j3.app j3-aarch64-macos.zip
          tar -czf j3-server-aarch64-macos.tar.gz -C target/release j3-server
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            j3-aarch64-macos.zip
            j3-server-aarch64-macos.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes ./*
