  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  react-native-keyboard-controller@1.22.8: patches/react-native-keyboard-controller@1.22.8.patch
  "@expo/ui@58.0.20": patches/@expo__ui@58.0.20.patch
  # Exports the dependency-light subpaths mobile imports.
  "@pierre/diffs@1.6.1": patches/@pierre%2Fdiffs@1.6.1.patch

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  allowedVersions:
    vite: "*"

# Deny agent skills that dependencies ship.
permissions:
  expo-sqlite:
    skills: false
